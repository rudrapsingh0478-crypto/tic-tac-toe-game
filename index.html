<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mera game</title>

    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <!-- <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    /> -->

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="wrapper">

        <p class="game-info"></p>

        <div class="tic-tac-toe" role="group" aria-label="Tic-tac-toe board">
            <button class="box box1" type="button" aria-label="Cell 1, empty"></button>
            <button class="box box2" type="button" aria-label="Cell 2, empty"></button>
            <button class="box box3" type="button" aria-label="Cell 3, empty"></button>
            <button class="box box4" type="button" aria-label="Cell 4, empty"></button>
            <button class="box box5" type="button" aria-label="Cell 5, empty"></button>
            <button class="box box6" type="button" aria-label="Cell 6, empty"></button>
            <button class="box box7" type="button" aria-label="Cell 7, empty"></button>
            <button class="box box8" type="button" aria-label="Cell 8, empty"></button>
            <button class="box box9" type="button" aria-label="Cell 9, empty"></button>
        </div>

        <button class="btn">New Game</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
